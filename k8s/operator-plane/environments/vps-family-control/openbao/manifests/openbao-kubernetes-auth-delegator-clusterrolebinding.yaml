# Minimal TokenReview permission for the Global OpenBao server ServiceAccount.
# Apply only as part of the explicit Kubernetes auth configuration procedure.
#
# The configure script discovers the live OpenBao ServiceAccount and can render
# an equivalent binding dynamically. Keep this manifest as the versioned shape
# of the required permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-global-tokenreview-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao-operator
