apiVersion: batch/v1
kind: Job
metadata:
  name: operator-plane-secret-sync
  namespace: operator-secret-sync
  labels:
    app.kubernetes.io/name: operator-secret-sync
    app.kubernetes.io/part-of: operator-plane
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-secret-sync
        app.kubernetes.io/part-of: operator-plane
    spec:
      serviceAccountName: operator-plane-secret-sync
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: operator-secret-sync:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/bash
            - /scripts/sync-operator-plane-secrets.sh
          env:
            - name: BAO_ADDR
              value: https://openbao-global.openbao-operator.svc:8200
            - name: BAO_CACERT
              value: /var/run/openbao-ca/ca.crt
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            - name: openbao-ca
              mountPath: /var/run/openbao-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: sync-script
          configMap:
            name: operator-plane-secret-sync-script
            defaultMode: 0555
        - name: openbao-ca
          configMap:
            name: openbao-ca-bundle
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
