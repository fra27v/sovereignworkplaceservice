    app.kubernetes.io/name: operator-secret-sync
    app.kubernetes.io/part-of: operator-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-plane-secret-sync
subjects:
  - kind: ServiceAccount
    name: operator-plane-secret-sync
    namespace: operator-secret-sync
