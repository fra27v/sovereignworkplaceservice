apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-plane-secret-sync
  namespace: kube-system
  labels:
    app.kubernetes.io/name: operator-secret-sync
    app.kubernetes.io/part-of: operator-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-plane-secret-sync
  namespace: kube-system
