# Operator-plane secret registry for vps-family-control.
#
# This file contains schemas, logical paths, key names, runtime projections, and
# documentation only. It must never contain secret values.
#
# KV paths below are logical paths used with `bao kv`, for example:
#   bao kv get -mount=operator-kv operator-plane/traefik/ovh-dns01
#
# OpenBao ACL policy paths for KV v2 must use the API paths:
#   operator-kv/data/...
#   operator-kv/metadata/...
#
# Kubernetes Secrets listed here are runtime projections. They are not the
# source of truth.
apiVersion: lab.sovrano.io/v1alpha1
kind: OperatorPlaneSecretRegistry
metadata:
  name: vps-family-control-operator-plane-secrets
  environment: vps-family-control
spec:
  sourceOfTruth:
    type: openbao-kv-v2
    mount: operator-kv
  entries:
    - id: traefik-ovh-dns01
      description: Traefik OVH DNS-01 credentials for Let's Encrypt ACME.
      openbao:
        mount: operator-kv
        logicalPath: operator-plane/traefik/ovh-dns01
        kvVersion: 2
      expectedKeys:
        - OVH_ENDPOINT
        - OVH_APPLICATION_KEY
        - OVH_APPLICATION_SECRET
        - OVH_CONSUMER_KEY
      projection:
        type: kubernetes-secret
        namespace: kube-system
        name: traefik-ovh-dns-credentials
        keys:
          - OVH_ENDPOINT
          - OVH_APPLICATION_KEY
          - OVH_APPLICATION_SECRET
          - OVH_CONSUMER_KEY

    - id: operator-artifacts-family-infra-01
      description: Tenant access material for the operator-artifacts endpoint.
      openbao:
        mount: operator-kv
        logicalPath: operator-plane/operator-artifacts/family-infra-01
        kvVersion: 2
      expectedKeys:
        - username
        - token
      projection:
        type: kubernetes-secret
        namespace: operator-artifacts
        name: operator-artifacts-basicauth
        derived:
          users: htpasswd line generated from username + token

    - id: operator-artifacts-family-infra-01-config
      description: Sensitive runtime inputs for the operator-artifacts endpoint.
      openbao:
        mount: operator-kv
        logicalPath: operator-plane/operator-artifacts/family-infra-01-config
        kvVersion: 2
      expectedKeys:
        - OPERATOR_ARTIFACTS_PUBLIC_HOSTNAME
        - OPERATOR_ARTIFACTS_ALLOWED_SOURCE_RANGES
      projection:
        type: config/runtime-input
        note: Sensitive operational config, not committed to Git.
