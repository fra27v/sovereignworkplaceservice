# family-infra runtime Traefik overrides.
# This environment is a single-node k3s installation without ServiceLB or MetalLB.
# This Traefik instance directly owns host ports 80 and 443.
# The IngressClass name is explicit to avoid relying on Helm release-name defaults.

deployment:
  replicas: 1

updateStrategy:
  type: Recreate
  rollingUpdate: null

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik-family-infra

providers:
  kubernetesCRD:
    ingressClass: traefik-family-infra
  kubernetesIngress:
    ingressClass: traefik-family-infra
    publishedService:
      enabled: false

service:
  enabled: false

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: false
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: false
    exposedPort: 443
    protocol: TCP