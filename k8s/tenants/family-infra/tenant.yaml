schemaVersion: 1

tenant:
  name: family-infra
  node: family-infra-01

components:
  openbao:
    release: 1

storage:
  openbao:
    class: local-path
    size: 1Gi

pki:
  root:
    ttl: 87600h
  issuing:
    ttl: 26280h
  leaf:
    defaultTtl: 2160h

openbao:
  canonicalDnsName: vault.internal
  transit:
    address: https://operator-vault.varrese.com

operatorPlane:
  artifacts:
    address: https://operator-artifacts.varrese.com

recovery:
  shares: 3
  threshold: 2
