apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: smoke-whoami
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: family-infra-traefik-smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
        app.kubernetes.io/part-of: family-infra-traefik-smoke-test
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - name: http
              containerPort: 80
